<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rebesta Fresh Admin</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/brand/icon-r-192.png"><link rel="apple-touch-icon" href="/assets/brand/icon-r-180.png"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#074015"><meta name="description" content="Rebesta Fresh store administration."><meta property="og:title" content="Admin"><meta property="og:description" content="Rebesta Fresh store administration."><meta property="og:type" content="website"><meta property="og:image" content="https://rebestafresh.in/assets/brand/logo.png"><meta name="twitter:card" content="summary"><link rel="stylesheet" crossorigin href="/react/main-CkUnzB-a.css">
  <link rel="stylesheet" href="/css/styles.css?v=20261006ac">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    .admin-tabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:6px;background:#eaf1e6;border-radius:16px;margin-bottom:20px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .admin-tabs::-webkit-scrollbar{display:none}
    .admin-tab{flex:0 0 auto;border:none;background:transparent;color:#33452f;font-weight:700;font-size:.92rem;padding:10px 16px;border-radius:11px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
    .admin-tab:hover{background:#dbe7d4}
    .admin-tab.active{background:#074015;color:#fff;box-shadow:0 2px 8px rgba(7,64,21,.28)}
    .admin-tab .tab-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#f28c28;margin-left:6px;vertical-align:2px}
    .live-pill{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:#1f7a3d;padding:0 12px}
    .live-dot{width:9px;height:9px;border-radius:50%;background:#2ecc71;animation:livepulse 2s infinite}
    @keyframes livepulse{0%,100%{box-shadow:0 0 0 0 rgba(46,204,113,.55)}50%{box-shadow:0 0 0 6px rgba(46,204,113,0)}}
    .orders-filter{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .orders-filter select,.orders-filter input{min-height:38px;border:1px solid #cbd8c5;border-radius:10px;padding:6px 10px;background:#fff;font-size:.88rem}
    .recent-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #edf2ea;cursor:pointer}
    .recent-row:hover{background:#f7faf5}
    .recent-row .ri{font-size:1.2rem}
    .recent-row .rmeta{font-size:.8rem;color:var(--muted,#6b7a66)}
    .recent-row .rtotal{margin-left:auto;font-weight:800;color:#074015;white-space:nowrap}
    @media(max-width:720px){.admin-layout{grid-template-columns:1fr!important}.live-pill{display:none}}
  </style>
  <script type="module" crossorigin src="/react/main-raRr0T84.js"></script>
    <link rel="stylesheet" href="/css/apple-skin.css?v=1">
</head>
<body class="admin-theme">
  <div id="root"></div>
</body>
</html>
