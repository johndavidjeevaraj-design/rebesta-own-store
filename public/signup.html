<head>
  <meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="icon" type="image/png" href="/assets/brand/icon-192.png"><link rel="apple-touch-icon" href="/assets/brand/icon-192.png"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#074015"><meta name="description" content="Create a Rebesta Fresh account — see every order, reorder favourites. Optional: you can always shop without an account.">
  <link rel="stylesheet" href="/css/styles.css?v=20260929f37">

<body>
  <header class="site-header"><div class="container header-inner"><a class="logo" href="/"><img src="/assets/brand/logo.png" alt="Rebesta Fresh" width="191" height="24"></a><span class="header-location">Your account</span><span></span><div class="header-actions"><a class="whatsapp-link" href="https://wa.me/918438765119">Help</a><a class="cart-link" href="/shop">Shop fresh</a></div></div></header>
  <main><section class="section"><div class="container" style="max-width:560px">
    <div class="shop-panel" style="padding:32px">
      <span class="eyebrow">Join Rebesta</span>
      <h1 class="section-title">Create your account</h1>
      <p class="section-subtitle" style="margin-bottom:22px">Just name, mobile and a password. Shopping never requires an account — this is only for your convenience.</p>
      <form data-signup-form class="form-grid" novalidate>
        <div class="field wide"><label for="suName">Your name</label><input id="suName" name="name" autocomplete="name" required placeholder="e.g. Priya R"></div>
        <div class="field wide"><label for="suPhone">Mobile number</label><input id="suPhone" name="phone" inputmode="tel" autocomplete="tel" required placeholder="10-digit mobile number"></div>
        <div class="field wide"><label for="suPassword">Password</label><input id="suPassword" name="password" type="password" autocomplete="new-password" required minlength="6" placeholder="At least 6 characters"></div>
        <button class="button orange full" type="submit" data-signup-submit>Create account</button>
      </form>
      <div data-auth-error class="alert error" hidden style="margin-top:14px"></div>
      <p class="auth-alt">Already have an account? <a href="/login">Sign in</a>.</p>
    </div>
  </div></section></main>

    <a class="bn-item bn-cart" href="/cart"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 17h2l2-8h8l1 5h3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="19" r="2" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="2" stroke="currentColor" stroke-width="2"/></svg><span>Basket</span><span class="bn-badge" data-cart-count>0</span></a>
